<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Posts - Save The Sea 2.0</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="page-container">
        <h1>Posts of Cleanup Campaigns</h1>
        <div class="posts-list">
            <div class="post-card">
                <strong>Chamika Perera:</strong> Great teamwork at Mount Lavinia! We collected 45kg of waste today. #SaveTheSea
            </div>
            <div class="post-card">
                <strong>Nishani Silva:</strong> So proud to be part of the Galle Face cleanup. Let's keep our beaches clean!
            </div>
        </div>
        <form class="add-post-form">
            <label for="post">Add a Post</label>
            <textarea id="post" required></textarea>
            <button type="submit">Add Post</button>
        </form>
        <a href="campaigns.html" class="back-link">Back to Campaigns</a>
    </div>
</body>
</html>
