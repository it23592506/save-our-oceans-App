<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Marine Waste - Save The Sea 2.0</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="page-container">
        <h1>Report Marine Waste</h1>
        <form class="report-form">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Mount Lavinia Beach" required>
            <label for="type">Type of Waste</label>
            <input type="text" id="type" placeholder="e.g. Plastic bottles" required>
            <label for="details">Details</label>
            <textarea id="details" placeholder="Describe the waste and its impact" required></textarea>
            <button type="submit">Submit Report</button>
        </form>
        <a href="../index.html" class="back-link">Back to Home</a>
    </div>
</body>
</html>
